[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "india-econ"
version = "0.1.0"
description = "A small, honestly-scoped Python package for pulling a handful of Indian economic indicators into pandas, with transparent live/synthetic fallback."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Nathaniel Zegenbal" },
]
keywords = ["india", "economics", "gdp", "inflation", "pandas", "world-bank"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/zegenbalnathaniel-design/India-Economic-Intelligence-Lab"
Repository = "https://github.com/zegenbalnathaniel-design/India-Economic-Intelligence-Lab"

[tool.hatch.build.targets.wheel]
packages = ["src/india_econ"]
