[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-inflation-index"
version = "0.1.0"
description = "A Laspeyres-style personal inflation index calculator: build your own household basket and compare it to an illustrative CPI-style reference series."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nathaniel Zegenbal" }
]
keywords = ["inflation", "cpi", "laspeyres", "economics", "india", "personal-finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.30",
    "plotly>=5.18",
]
dev = [
    "pytest>=7.4",
]
notebooks = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/zegenbalnathaniel-design/India-Economic-Intelligence-Lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
