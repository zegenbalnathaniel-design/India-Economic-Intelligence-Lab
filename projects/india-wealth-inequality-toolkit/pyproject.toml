[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-inequality"
version = "0.1.0"
description = "A small Python toolkit for income and wealth inequality measurement (Gini, Lorenz, percentile shares, Palma ratio) plus a household wealth-composition simulator."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nathaniel Zegenbal" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.32", "plotly>=5.19"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
