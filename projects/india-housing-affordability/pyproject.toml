[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-affordability"
version = "0.1.0"
description = "A Python toolkit of home-ownership affordability metrics (EMI, price-to-income, LTV, interest burden) plus a multi-year scenario projector, demonstrated on a synthetic per-city Indian housing baseline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nathaniel Zegenbal" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.32", "plotly>=5.19"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
