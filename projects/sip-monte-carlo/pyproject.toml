[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sip-monte-carlo"
version = "0.1.0"
description = "A Monte Carlo simulator for Indian SIP (systematic investment plan) wealth accumulation: growing monthly contributions, fees, inflation, and the full distribution of outcomes under stated return/volatility assumptions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nathaniel Zegenbal" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
app = ["streamlit>=1.32", "plotly>=5.19"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
