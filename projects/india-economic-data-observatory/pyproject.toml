[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-data-observatory"
version = "0.1.0"
description = "A data ingestion, cleaning and validation platform for Indian economic indicators, with explicit live/synthetic provenance on every series."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nathaniel Zegenbal" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "requests>=2.31"]

[project.optional-dependencies]
app = ["streamlit>=1.32", "plotly>=5.19"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
