[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-lab"
version = "0.1.0"
description = "Modern Portfolio Theory from scratch: Sharpe ratios, Lagrangian-derived minimum-variance and tangency portfolios, and the efficient frontier over a configurable multi-exchange global stock universe."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nathaniel Zegenbal" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
app = ["streamlit>=1.32", "plotly>=5.19", "yfinance>=0.2.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
